services:
  - type: web
    name: lms
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        value: /data/lms.db
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: lms-data
      mountPath: /data
      sizeGB: 1